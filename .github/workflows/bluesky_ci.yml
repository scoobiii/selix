name: Publicar Snapshot SELIX (Fonte Única)

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build official snapshot from BCB
        run: python scripts/build_official_snapshot.py
      - name: Upload canonical snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: selix-official-snapshot
          path: |
            selix-official.json
            public/selix-official.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish validated snapshot
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/bluesky_ci_publisher.py
