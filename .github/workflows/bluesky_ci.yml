name: Gerar snapshot histórico SELIX e publicar observação live

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and validate live BCB snapshot
        run: python scripts/build_official_snapshot.py

      - name: Open or update PR with the fresh snapshot
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/selix-official-snapshot
          delete-branch: true
          add-paths: |
            selix-official.json
            public/selix-official.json
          commit-message: "chore(data): refresh historical BCB Selic snapshot"
          title: "chore(data): refresh historical SELIX snapshot"
          body: |
            Atualização automatizada de um artefato histórico SELIX; não representa o estado CURRENT.

            - Fonte da Selic observada: BCB SGS 432.
            - O arquivo gerado é marcado `status=historical_snapshot` e `is_current=false`.
            - Esta automação abre/atualiza um PR; não grava diretamente em `main`.
            - O artefato versionado nunca pode ser usado como fallback de taxa atual. Se a fonte oficial falhar, a geração falha.

            Revise `source.observation_date`, `snapshot_created_at` e `content_sha256` antes de mesclar.

      - name: Upload generated snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: selix-official-snapshot
          path: |
            selix-official.json
            public/selix-official.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish live SPI-validated Selic observation
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/bluesky_ci_publisher.py
