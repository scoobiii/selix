name: SELIX Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Prepare dirs + DB
        env:
          SELIX_DB_PATH: /tmp/selix_ci.db
        run: |
          mkdir -p /tmp/selix_cache /tmp/selix_logs
          python scripts/init_db.py

      - name: Unit / core tests (sem servidor)
        env:
          SELIX_DB_PATH: /tmp/selix_ci.db
          SELIX_CACHE_DIR: /tmp/selix_cache
          SELIX_LOG_DIR: /tmp/selix_logs
          MASTER_API_KEY: master_123_super_secret
          SELIX_API_KEYS: test_api_key_123
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/scripts
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_api.py \
            --ignore=tests/test_security.py \
            --ignore=tests/test_admin_api.py \
            -k "not (api or live or integration)"

      - name: Start API in background
        env:
          SELIX_DB_PATH: /tmp/selix_ci.db
          MASTER_API_KEY: master_123_super_secret
          SELIX_API_KEYS: test_api_key_123
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          nohup python src/api/main_v4_fixed.py > /tmp/selix_logs/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/v1/health >/dev/null; then
              echo "API UP em ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "=== API LOG ==="
          cat /tmp/selix_logs/api.log || true
          exit 1

      - name: API / integration tests
        env:
          SELIX_DB_PATH: /tmp/selix_ci.db
          MASTER_API_KEY: master_123_super_secret
          SELIX_API_KEYS: test_api_key_123
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/scripts
        run: |
          pytest tests/test_api.py tests/test_security.py tests/test_admin_api.py -v --tb=short

      - name: Summary
        if: always()
        run: |
          echo "## SELIX CI" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Log API (se existir):" >> $GITHUB_STEP_SUMMARY
          tail -n 30 /tmp/selix_logs/api.log 2>/dev/null >> $GITHUB_STEP_SUMMARY
