name: SELIX Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Inicializar banco de dados
        env:
          SELIX_DB_PATH: /tmp/selix_ci.db
        run: python scripts/init_db.py

      - name: Criar diretórios de cache e logs
        run: |
          mkdir -p /tmp/selix_cache
          mkdir -p /tmp/selix_logs

      - name: Rodar suíte de testes
        env:
          SELIX_DB_PATH: /tmp/selix_ci.db
          SELIX_CACHE_DIR: /tmp/selix_cache
          SELIX_LOG_DIR: /tmp/selix_logs
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts:${{ github.workspace }}/src
        run: pytest -v --tb=short

      - name: Resumo
        if: always()
        run: |
          echo "## Resultado da suíte" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
